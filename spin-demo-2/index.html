<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weapon Cache</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
<style>
  :root {
    --case-w: 19.5%;
    --tan: #d8c9a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
    background: #0b0b0c;
    color: var(--tan);
    font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: min(92vw, 120vh, 1000px);
    aspect-ratio: 1936 / 1080;
    display: flex;
    justify-content: center;
    user-select: none;
  }
  .shelf {
    position: relative;
    height: 100%;
    aspect-ratio: 1;
    container-type: size;
  }
  .shelf > img.bg { width: 100%; display: block; }
  .case {
    position: absolute;
    width: var(--case-w);
    aspect-ratio: 720 / 559;
    left: var(--x);
    bottom: calc(100% - var(--y));
    transform: translateX(-50%);
    background: var(--img) bottom center / 100% auto no-repeat;
    pointer-events: none;
  }
  .more {
    position: absolute;
    left: 70.2%;
    right: 8.3%;
    top: 70.6%;
    bottom: 10.7%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    font-family: 'Black Ops One', 'Arial Narrow', sans-serif;
    text-shadow: 0 2px 12px #000;
    pointer-events: none;
  }
  .more b {
    font-size: 7.4cqw;
    font-weight: 400;
    letter-spacing: 0.02em;
  }
  .more span {
    margin-top: 0.5em;
    font-size: 1.55cqw;
    letter-spacing: 0.18em;
  }
  .controls {
    width: min(92vw, 1000px);
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .controls input {
    flex: 1;
    accent-color: #d8c9a3;
  }
  .open {
    font-family: 'Black Ops One', 'Arial Narrow', sans-serif;
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #12100c;
    background: linear-gradient(#e6d7ae, #b8a575);
    border: 1px solid #6b5f43;
    border-radius: 3px;
    padding: 14px 44px;
    cursor: pointer;
    box-shadow: 0 6px 22px #0009;
  }
  .open:hover { background: linear-gradient(#f2e5c2, #c9b684); }
  .open:active { transform: translateY(1px); }
  .vault {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    transition: opacity 600ms ease;
  }
  .vault video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .vault.fade { opacity: 0; }
  .controls output {
    min-width: 3ch;
    font-size: 22px;
    font-weight: 700;
    text-align: right;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="shelf" id="shelf">
      <img class="bg" src="assets/shelf.png" alt="">
    </div>
    <div class="vault" id="vault">
      <video id="vaultVideo" src="assets/vault.webm" preload="auto" playsinline></video>
    </div>
  </div>

  <div class="controls">
    <input id="count" type="range" min="0" max="50" value="15">
    <output id="out">15</output>
  </div>

  <button class="open" type="button">Open vault</button>

<script>
  const COLS = [19.2, 40.1, 61.2, 82.5];
  const ROWS = [28.8, 47.5, 67.0, 87.7];
  const SLOTS = ROWS.flatMap((y, r) => COLS.slice(0, r === 3 ? 3 : 4).map(x => ({ x, y })));

  const CASES = [
    'danger-zone.png',
    'dreams-nightmares.png',
    'esports-2013-winter.png',
    'esports-2013.png',
    'esports-2014-summer.png',
    'falchion.png',
    'fever.png',
    'fracture.png',
    'gallery.png',
    'gamma-2.png',
    'gamma.png',
    'glove.png',
    'horizon.png',
    'huntsman.png',
    'kilowatt.png',
    'operation-bravo.png',
    'operation-breakout.png',
    'operation-broken-fang.png'
  ];
  const picks = [];
  const pick = i => picks[i] ??= CASES[Math.floor(Math.random() * CASES.length)];

  const shelf = document.getElementById('shelf');
  const input = document.getElementById('count');
  const out = document.getElementById('out');

  function render(n) {
    shelf.querySelectorAll('.case, .more').forEach(el => el.remove());
    const shown = Math.min(n, SLOTS.length);
    for (let i = 0; i < shown; i++) {
      const el = document.createElement('div');
      el.className = 'case';
      el.style.setProperty('--x', SLOTS[i].x + '%');
      el.style.setProperty('--y', SLOTS[i].y + '%');
      el.style.setProperty('--img', `url('assets/cases/${pick(i)}')`);
      shelf.append(el);
    }
    if (n > SLOTS.length) {
      const el = document.createElement('div');
      el.className = 'more';
      el.innerHTML = `<b>+${n - SLOTS.length}</b><span>OTHER CASES</span>`;
      shelf.append(el);
    }
    out.value = n;
  }

  const vault = document.getElementById('vault');
  const video = document.getElementById('vaultVideo');
  const sound = new Audio('assets/open_sound.mp3');

  document.querySelector('.open').addEventListener('click', () => {
    sound.currentTime = 0;
    sound.play();
    vault.classList.remove('fade');
    vault.hidden = false;
    video.currentTime = 0;
    video.play();
  });

  video.addEventListener('ended', () => {
    vault.classList.add('fade');
    setTimeout(() => { vault.hidden = true; }, 600);
  });

  input.addEventListener('input', () => render(+input.value));
  render(+input.value);
</script>
</body>
</html>
